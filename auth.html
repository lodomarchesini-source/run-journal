<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Runnny</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page auth-page">
      <header class="header">
        <h1 class="title">Runnny</h1>
        <p class="auth-intro-text">Your watch knows your pace, but not what your thinking. Runnny is a running journal designed for the runner who wants to understand their progress.</p>
      </header>

      <main class="auth-main">
        <section class="auth-panel" aria-label="Account login">
          <div id="auth-entry-actions" class="auth-entry-actions">
            <button type="button" class="btn btn-primary auth-entry-btn auth-entry-btn--start" data-auth-open>
              Start writing
            </button>
          </div>
          <form id="auth-request-form" class="auth-row" hidden>
            <label class="auth-field">
              <span class="label">Log in/Sign up</span>
              <input
                type="email"
                id="auth-email"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </label>
            <button type="submit" class="btn btn-primary auth-btn">
              Send magic link
            </button>
          </form>

          <div class="auth-meta">
            <span id="auth-status" class="auth-status is-muted"></span>
          </div>
        </section>
      </main>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
