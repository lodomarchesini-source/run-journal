<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runnny</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260608v" />
  </head>
  <body>
    <div class="page journal-page">
      <header class="header">
        <div class="header-top">
          <div class="title-row">
            <h1 id="page-title" class="title">Runnny</h1>
            <button
              type="button"
              id="edit-page-title"
              class="edit-title-icon-btn"
              aria-label="Edit page title"
              title="Edit page title"
            >
              <svg
                class="edit-title-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M4 20h4l10-10a2 2 0 0 0-4-4L4 16v4z"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M12.5 7.5l4 4"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
          <div class="header-actions">
            <button type="button" id="auth-signout" class="btn btn-ghost auth-signout">
              Sign out
            </button>
          </div>
        </div>
        <span id="account-email" class="auth-status is-muted" hidden></span>
        <section class="totals-row" aria-label="Totals across all runs">
          <div class="totals-item totals-item--runs">
            <span class="totals-label">Runs</span>
            <span id="total-runs" class="totals-value">0</span>
            <div
              id="runs-time-breakdown"
              class="runs-time-tip"
              role="tooltip"
              aria-hidden="true"
            ></div>
          </div>
          <div class="totals-item">
            <span class="totals-label">Total elapsed time</span>
            <span id="total-elapsed" class="totals-value">—</span>
          </div>
          <div class="totals-item">
            <span class="totals-label">Total distance</span>
            <span id="total-distance" class="totals-value">—</span>
          </div>
        </section>
      </header>

      <main class="main-runs">
        <button
          type="button"
          id="new-run-entry"
          class="btn btn-primary auth-entry-btn auth-entry-btn--start new-run-entry-btn"
        >
          + New run
        </button>
        <div class="runs-carousel-viewport" aria-hidden="false">
          <ul id="runs-list" class="runs-carousel" aria-label="Runs"></ul>
        </div>
      </main>
    </div>

    <div
      id="run-modal"
      class="modal run-entry-modal"
      aria-hidden="true"
      role="presentation"
    >
      <button type="button" class="modal-backdrop" id="modal-backdrop" tabindex="-1" aria-label="Close dialog"></button>
      <div
        class="modal-panel run-entry-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="run-modal-title"
      >
        <form id="run-form" class="run-entry-form">
          <header class="run-entry-header">
            <h2 id="run-modal-title" class="run-entry-title">New run</h2>
            <div class="run-entry-header-actions">
              <button type="button" class="btn run-entry-btn-cancel" id="run-cancel">
                Cancel
              </button>
              <button type="submit" class="btn btn-primary run-entry-btn-save">
                Save
              </button>
            </div>
          </header>

          <div class="run-entry-meta">
            <label class="run-entry-meta-field">
              <span class="run-entry-meta-label">Date</span>
              <input type="date" name="date" id="run-date" class="run-entry-meta-input" required />
            </label>
            <label class="run-entry-meta-field">
              <span class="run-entry-meta-label">Time</span>
              <input
                type="text"
                name="durationHMS"
                id="run-duration"
                class="run-entry-meta-input run-entry-meta-input--time"
                autocomplete="off"
                spellcheck="false"
                placeholder="00:00:00"
              />
            </label>
            <label class="run-entry-meta-field run-entry-meta-field--distance">
              <span class="run-entry-meta-label">Distance</span>
              <input
                type="text"
                name="distance"
                id="run-distance"
                class="run-entry-meta-input run-entry-meta-input--distance"
                inputmode="decimal"
                autocomplete="off"
                spellcheck="false"
                size="6"
                placeholder="0"
                required
              />
            </label>
            <label class="run-entry-meta-field run-entry-meta-field--when">
              <span class="run-entry-meta-label">When</span>
              <select
                name="timeOfDay"
                id="run-time-of-day"
                class="run-entry-meta-select"
                aria-label="When"
              >
                <option value="morning">Morning</option>
                <option value="day" selected>Day</option>
                <option value="evening">Evening</option>
              </select>
            </label>
          </div>

          <div class="run-entry-write">
            <textarea
              name="notes"
              id="run-notes"
              class="run-entry-notes"
              placeholder="Start typing"
              spellcheck="true"
              rows="1"
            ></textarea>
            <button type="button" class="run-entry-delete" id="run-delete" hidden>
              Delete run
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js?v=20260608j"></script>
  </body>
</html>
